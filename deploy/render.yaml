# Render Blueprint (needs a paid instance type: persistent disks are not available on the free plan).
services:
  - type: web
    name: ak-digital-printing
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: singapore
    healthCheckPath: /api/health
    disk:
      name: ak-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: SITE_URL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: OTP_PEPPER
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
